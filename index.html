<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divit Luxe Holidays — Coming Soon</title>
    <meta name="description" content="Divit Luxe Holidays — Luxury Holiday Experiences. Launching October 2026.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Raleway:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Raleway', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a1628 0%, #1a2a4a 40%, #0f1d36 100%);
            color: #f0e6d3;
            overflow: hidden;
            position: relative;
        }

        /* Subtle animated background particles */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(1px 1px at 10% 20%, rgba(212, 175, 110, 0.4) 0%, transparent 100%),
                radial-gradient(1px 1px at 30% 60%, rgba(212, 175, 110, 0.3) 0%, transparent 100%),
                radial-gradient(1px 1px at 50% 10%, rgba(212, 175, 110, 0.2) 0%, transparent 100%),
                radial-gradient(1px 1px at 70% 40%, rgba(212, 175, 110, 0.4) 0%, transparent 100%),
                radial-gradient(1px 1px at 90% 80%, rgba(212, 175, 110, 0.3) 0%, transparent 100%),
                radial-gradient(1px 1px at 20% 90%, rgba(212, 175, 110, 0.2) 0%, transparent 100%),
                radial-gradient(1px 1px at 80% 15%, rgba(212, 175, 110, 0.3) 0%, transparent 100%);
            animation: twinkle 4s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes twinkle {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 700px;
            position: relative;
            z-index: 1;
        }

        /* Decorative line above logo */
        .ornament {
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #d4af6e, transparent);
            margin: 0 auto 1.5rem;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 3.2rem;
            font-weight: 700;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #d4af6e 0%, #f5e6c8 50%, #d4af6e 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s ease-in-out infinite;
            margin-bottom: 0.3rem;
        }

        @keyframes shimmer {
            0% { background-position: 0% center; }
            50% { background-position: 100% center; }
            100% { background-position: 0% center; }
        }

        .logo-sub {
            font-family: 'Raleway', sans-serif;
            font-size: 0.95rem;
            font-weight: 300;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #d4af6e;
            margin-bottom: 2.5rem;
        }

        .tagline {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            font-weight: 400;
            font-style: italic;
            color: rgba(240, 230, 211, 0.7);
            margin-bottom: 0.8rem;
        }

        .coming-soon {
            font-size: 1.6rem;
            font-weight: 300;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: #f0e6d3;
            margin-bottom: 2.5rem;
        }

        /* Countdown */
        .countdown {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .countdown-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .countdown-number {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            font-weight: 700;
            color: #d4af6e;
            line-height: 1;
            min-width: 70px;
        }

        .countdown-label {
            font-size: 0.7rem;
            font-weight: 400;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(240, 230, 211, 0.5);
            margin-top: 0.5rem;
        }

        .countdown-separator {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            color: rgba(212, 175, 110, 0.3);
            align-self: flex-start;
            margin-top: 0.3rem;
        }

        /* Divider */
        .divider {
            width: 120px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 110, 0.5), transparent);
            margin: 0 auto 2rem;
        }

        /* Notify section */
        .notify-text {
            font-size: 0.85rem;
            font-weight: 300;
            color: rgba(240, 230, 211, 0.6);
            margin-bottom: 1rem;
            letter-spacing: 1px;
        }

        .email-form {
            display: flex;
            justify-content: center;
            gap: 0;
            max-width: 420px;
            margin: 0 auto 2.5rem;
        }

        .email-input {
            flex: 1;
            padding: 0.85rem 1.2rem;
            border: 1px solid rgba(212, 175, 110, 0.3);
            border-right: none;
            border-radius: 2px 0 0 2px;
            background: rgba(255, 255, 255, 0.05);
            color: #f0e6d3;
            font-family: 'Raleway', sans-serif;
            font-size: 0.85rem;
            font-weight: 300;
            letter-spacing: 1px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .email-input::placeholder {
            color: rgba(240, 230, 211, 0.35);
        }

        .email-input:focus {
            border-color: #d4af6e;
        }

        .email-btn {
            padding: 0.85rem 1.8rem;
            background: linear-gradient(135deg, #d4af6e, #c49b5a);
            border: 1px solid #d4af6e;
            border-radius: 0 2px 2px 0;
            color: #0a1628;
            font-family: 'Raleway', sans-serif;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .email-btn:hover {
            background: linear-gradient(135deg, #e0be7a, #d4af6e);
            box-shadow: 0 0 20px rgba(212, 175, 110, 0.3);
        }

        .success-msg {
            display: none;
            color: #d4af6e;
            font-size: 0.85rem;
            font-weight: 300;
            margin-top: -1.5rem;
            margin-bottom: 2rem;
            letter-spacing: 1px;
        }

        /* Footer */
        .footer {
            font-size: 0.7rem;
            font-weight: 300;
            color: rgba(240, 230, 211, 0.3);
            letter-spacing: 2px;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .logo {
                font-size: 2.2rem;
                letter-spacing: 2px;
            }

            .logo-sub {
                font-size: 0.75rem;
                letter-spacing: 4px;
            }

            .coming-soon {
                font-size: 1.2rem;
                letter-spacing: 5px;
            }

            .countdown {
                gap: 0.8rem;
            }

            .countdown-number {
                font-size: 2rem;
                min-width: 50px;
            }

            .countdown-label {
                font-size: 0.6rem;
            }

            .countdown-separator {
                font-size: 1.6rem;
            }

            .email-form {
                flex-direction: column;
                gap: 0.5rem;
            }

            .email-input {
                border-right: 1px solid rgba(212, 175, 110, 0.3);
                border-radius: 2px;
            }

            .email-btn {
                border-radius: 2px;
            }
        }

        /* Fade-in animation */
        .fade-in {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 0.8s ease forwards;
        }

        .fade-in:nth-child(2) { animation-delay: 0.2s; }
        .fade-in:nth-child(3) { animation-delay: 0.4s; }
        .fade-in:nth-child(4) { animation-delay: 0.6s; }
        .fade-in:nth-child(5) { animation-delay: 0.8s; }
        .fade-in:nth-child(6) { animation-delay: 1.0s; }
        .fade-in:nth-child(7) { animation-delay: 1.2s; }
        .fade-in:nth-child(8) { animation-delay: 1.4s; }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="ornament fade-in"></div>

        <h1 class="logo fade-in">Divit Luxe</h1>
        <p class="logo-sub fade-in">Holidays</p>

        <p class="tagline fade-in">Luxury Holiday Experiences</p>

        <h2 class="coming-soon fade-in">Coming Soon</h2>

        <div class="countdown fade-in" id="countdown" aria-label="Countdown to launch">
            <div class="countdown-item">
                <span class="countdown-number" id="days">--</span>
                <span class="countdown-label">Days</span>
            </div>
            <span class="countdown-separator">:</span>
            <div class="countdown-item">
                <span class="countdown-number" id="hours">--</span>
                <span class="countdown-label">Hours</span>
            </div>
            <span class="countdown-separator">:</span>
            <div class="countdown-item">
                <span class="countdown-number" id="minutes">--</span>
                <span class="countdown-label">Minutes</span>
            </div>
            <span class="countdown-separator">:</span>
            <div class="countdown-item">
                <span class="countdown-number" id="seconds">--</span>
                <span class="countdown-label">Seconds</span>
            </div>
        </div>

        <div class="divider fade-in"></div>

        <p class="notify-text fade-in">Be the first to know when we launch</p>
        <form class="email-form fade-in" id="notifyForm" action="https://formspree.io/f/xqpaqkdr" method="POST" onsubmit="handleSubmit(event)">
            <input
                type="email"
                name="email"
                class="email-input"
                placeholder="Enter your email"
                required
                aria-label="Email address"
            >
            <input type="hidden" name="_subject" value="New Notify Me signup — Divit Luxe Holidays">
            <button type="submit" class="email-btn">Notify Me</button>
        </form>
        <p class="success-msg" id="successMsg">Thank you! We'll be in touch.</p>

        <p class="footer fade-in">&copy; 2026 Divit Luxe Holidays. All rights reserved.</p>
    </div>

    <script>
        // Countdown to October 1, 2026
        const launchDate = new Date('2026-10-20T00:00:00').getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const gap = launchDate - now;

            if (gap <= 0) {
                document.getElementById('days').textContent = '0';
                document.getElementById('hours').textContent = '0';
                document.getElementById('minutes').textContent = '0';
                document.getElementById('seconds').textContent = '0';
                return;
            }

            const days = Math.floor(gap / (1000 * 60 * 60 * 24));
            const hours = Math.floor((gap % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((gap % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((gap % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = days;
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);

        // Form handler with Formspree
        function handleSubmit(e) {
            e.preventDefault();
            const form = document.getElementById('notifyForm');
            const msg = document.getElementById('successMsg');
            const data = new FormData(form);

            fetch(form.action, {
                method: 'POST',
                body: data,
                headers: { 'Accept': 'application/json' }
            }).then(response => {
                form.style.display = 'none';
                msg.style.display = 'block';
                if (!response.ok) {
                    msg.textContent = 'Something went wrong. Please try again.';
                }
            }).catch(() => {
                form.style.display = 'none';
                msg.style.display = 'block';
                msg.textContent = 'Something went wrong. Please try again.';
            });
        }
    </script>
</body>
</html>
